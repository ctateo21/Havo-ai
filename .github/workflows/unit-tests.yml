name: Unit tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: npm run test:unit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: npm

      - name: Install dependencies
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -o pipefail
          npm install -g npm@10.9.2
          npm ci --include=dev --no-audit --no-fund
          test -x node_modules/.bin/tsx
          npx --no-install tsx --version

      # `npm test` also runs Playwright against a dev server that needs
      # DATABASE_URL and Chromium. This job runs the unit files that do not
      # open a live Postgres connection. The managed-data, IFW, and insurance
      # cache files assert against a real database and are run where
      # DATABASE_URL points at one.
      - name: Run unit tests
        env:
          # Lets modules that construct a Pool import. Tests that actually
          # connect are excluded below.
          DATABASE_URL: postgres://unit-test:unit-test@127.0.0.1:5432/unit_test
        run: |
          set -o pipefail
          files=$(find client/src/lib server server/integrations -name '*.test.ts' \
            ! -name 'managed-data-*.test.ts' \
            ! -name 'ifw-activity-claims.test.ts' \
            ! -name 'insurance-cache-routes.test.ts' \
            | sort)
          npx --no-install tsx --test --test-concurrency=1 $files
      - name: TypeScript and production build
        run: npm run check && npm run build
        env:
          DATABASE_URL: postgres://unit-test:unit-test@127.0.0.1:5432/unit_test
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Mocked browser regression tests
        env:
          DATABASE_URL: postgres://unit-test:unit-test@127.0.0.1:5432/unit_test
        run: |
          npm run test:e2e
          # The standard suite stops its owned server. Start a fixture-only
          # server for the focused insurance suite; no carrier credentials.
          SUPABASE_SERVICE_ROLE_KEY= VITE_SUPABASE_URL=https://browser-test.supabase.co VITE_SUPABASE_ANON_KEY=browser-test-anon-key-with-more-than-twenty-characters npm run dev > /tmp/insurance-browser-server.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:5000/ >/dev/null && break; sleep 1; done
          npx playwright test -c client/src/components/insurance/insurance.browser.config.ts
